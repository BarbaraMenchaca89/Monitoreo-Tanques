
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
    <header>
        <h1>Monitoreo de tanques</h1>
        <p class="empresa">Acuatica del Golfo S.A.</p>
    </header>
    <main>
        <h2>Registro de Datos del Tanque</h2>
        <form class="form-registro">

            <label for="temperatura">Nivel de Temperature:</label>
            <input type="number" id="temperatura" name="temperatura" placeholder="Ej: 25.55" step="0.01" required>

            <label for="ph">Nivel de PH:</label>
            <input type="number" id="ph" name="ph" placeholder="Ej: 7.00" step="0.01" required>

            <label for="salinidad">Salinidad:</label>
            <input type="number" id="salinidad" name="salinidad" step="0.01"placeholder="Ej: 35.00" required>

            <label for="oxigeno">Oxigeno Disuelto:</label>
            <input type="number" id="oxigeno" name="oxigeno" placeholder="Ej. 8.00" step="0.01" required>

            <div class="botones">
                <button type="submit" class="btn">Registrar Tanque</button>
                <button type="button" id="btnMenu" class="btn">Menu</button>
            </div>
        </form>
    </main>
    <script src="app.js"></script>
</body>
</html>
